<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#24407e"/><stop offset=".55" stop-color="#112249"/><stop offset="1" stop-color="#070f24"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a6"/><stop offset="1" stop-color="#a87721"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset=".3" stop-color="#e9c35a"/><stop offset=".6" stop-color="#b8862a"/><stop offset="1" stop-color="#f0cf6e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#b9c4d6"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3a78"/><stop offset="1" stop-color="#0a1736"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f3d"/><stop offset="1" stop-color="#0c0f17"/></linearGradient>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4d"/><stop offset=".17" stop-color="#ff9a3c"/><stop offset=".34" stop-color="#ffe14d"/>
      <stop offset=".5" stop-color="#4cd964"/><stop offset=".67" stop-color="#3fa9ff"/><stop offset=".84" stop-color="#5a5cff"/><stop offset="1" stop-color="#b05cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd97a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd97a" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  
  <g transform="translate(256 262) scale(0.74) translate(-256 -256)"><ellipse cx="256" cy="300" rx="200" ry="150" fill="url(#glow)"/>

  <!-- computer: monitor -->
  <rect x="96" y="176" width="320" height="214" rx="24" fill="url(#gold)"/>
  <rect x="112" y="192" width="288" height="182" rx="14" fill="url(#screen)"/>
  <!-- screen content: a certificate card + spectrum stripe -->
  <rect x="148" y="222" width="216" height="124" rx="8" fill="#fdf8ea"/>
  <rect x="160" y="234" width="192" height="100" rx="5" fill="none" stroke="#c9a13b" stroke-width="3"/>
  <rect x="196" y="252" width="120" height="10" rx="5" fill="#2b3a5c"/>
  <rect x="176" y="274" width="160" height="8" rx="4" fill="url(#rb)"/>
  <rect x="206" y="292" width="100" height="6" rx="3" fill="#9aa6bd"/>
  <circle cx="256" cy="318" r="9" fill="#c9a13b"/>
  <!-- stand -->
  <path d="M226 390 h60 l10 34 h-80 z" fill="url(#silver)"/>
  <rect x="170" y="420" width="172" height="20" rx="10" fill="url(#silver)"/>

  <!-- graduation cap sitting on the monitor -->
  <path d="M186 150 v44 c0 20 32 34 70 34 s70 -14 70 -34 v-44 z" fill="url(#cap)"/>
  <path d="M256 70 L446 132 L256 194 L66 132 Z" fill="url(#cap)" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 84 L410 132 L256 180" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="10"/>
  <!-- tassel -->
  <path d="M256 132 L398 146 L398 222" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="132" r="11" fill="url(#gold)"/>
  <path d="M386 218 h24 l8 46 h-40 z" fill="url(#gold)"/>
  <path d="M386 218 h24" stroke="#8a5d17" stroke-width="4"/>
</g></svg>
